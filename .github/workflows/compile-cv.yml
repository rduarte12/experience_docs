name: Compile and publish LaTeX CVs

on:
  push:
    branches: [main]
    paths:
      - '**.tex'
      - '**.bib'

jobs:
  compile:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Compile CV
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: cv
          root_file: main.tex

      - name: Compile Resume
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: resume
          root_file: main.tex

      - name: Compile Sumula
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: sumula
          root_file: main.tex

      - name: Commit updated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cv/main.pdf resume/main.pdf sumula/main.pdf
          git diff --cached --quiet || git commit -m "docs: update compiled PDFs [skip ci]"
          git push